            e.preventDefault(); // Prevent the default form submission behavior

            const params = new URLSearchParams(window.location.search);

                alert("❌ You are not logged in. Redirecting to login...");
                window.location.href = "auth.html";
                return;
            }

            const role = sessionStorage.getItem("role");

            // ✅ Fetch report and student name

                    }
                } else {
                    console.error("❌ Error fetching report:", data);
                    alert("❌ Error fetching report. Check console for details.");
                }

                console.error("❌ Error fetching report:", error);
                alert("❌ Error fetching report. Check console for details.");

        });

                <h2>Report Details</h2>
                <p><strong>No report generated for this session.</strong></p>
                <button class="back-button" onclick="window.location.href = 'counselling.html';">Back to Counselling</button>
            `;
        }

        function displayWriteReportForm(studentName) {
            document.getElementById("writeReportForm").style.display = "block";
            document.getElementById("reportTitle").textContent = "Write Counselling Report";
            document.getElementById("studentName").value = studentName; // Auto-fill student name
        }

        function displayReportDetails(report) {
            document.getElementById("viewReportDetails").style.display = "block";
            document.getElementById("reportTitle").textContent = "View Counselling Report";

            document.getElementById("viewStudentName").textContent = report.student_name;
            document.getElementById("viewStudentAge").textContent = report.student_age;
            document.getElementById("viewDepartment").textContent = report.department;
            document.getElementById("viewDateOfAssessment").textContent = report.date_of_assessment;
            document.getElementById("viewReferredBy").textContent = report.referred_by;
            document.getElementById("viewBackgroundInformation").textContent = report.background_information;
            document.getElementById("viewCollectedFrom").textContent = report.collected_from;
            document.getElementById("viewReasonForReferral").textContent = report.reason_for_referral;
            document.getElementById("viewPreviousCounselingAttendance").textContent = report.previous_counseling_attendance ? "Yes" : "No";
            document.getElementById("viewPresentingComplaints").textContent = report.presenting_complaints;
            document.getElementById("viewObservationsFindings").textContent = report.observations_findings;
            document.getElementById("viewRecommendations").textContent = report.recommendations;
            document.getElementById("viewFollowUp").textContent = report.follow_up;
            // document.getElementById("viewCounsellorSignature").textContent = report.counsellor_signature;
        }

        document.getElementById("reportForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const sessionId = document.getElementById("sessionId").value;
            const studentAge = document.getElementById("studentAge").value;
            const department = document.getElementById("department").value;
            const dateOfAssessment = document.getElementById("dateOfAssessment").value;
            const referredBy = document.getElementById("referredBy").value;
            const backgroundInformation = document.getElementById("backgroundInformation").value;
            const collectedFrom = document.getElementById("collectedFrom").value;
            const reasonForReferral = document.getElementById("reasonForReferral").value;
            const previousCounselingAttendance = document.getElementById("previousCounselingAttendance").checked;
            const presentingComplaints = document.getElementById("presentingComplaints").value;
            const observationsFindings = document.getElementById("observationsFindings").value;
            const recommendations = document.getElementById("recommendations").value;
            const followUp = document.getElementById("followUp").value;
            // const counsellorSignature = document.getElementById("counsellorSignature").value;

            const token = sessionStorage.getItem("token");
            if (!token) {
                alert("❌ You are not logged in. Redirecting to login...");
                window.location.href = "auth.html";
                return;
            }

            try {
                const response = await fetch("https://unified-campus-system.onrender.com/api/report/add-report", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`,
                    },
                    body: JSON.stringify({
                        counselling_id: sessionId,
                        student_age: studentAge,
                        department: department,
                        date_of_assessment: dateOfAssessment,
                        referred_by: referredBy,
                        background_information: backgroundInformation,
                        collected_from: collectedFrom,
                        reason_for_referral: reasonForReferral,
                        previous_counseling_attendance: previousCounselingAttendance,
                        presenting_complaints: presentingComplaints,
                        observations_findings: observationsFindings,
                        recommendations: recommendations,
                        follow_up: followUp,
                        // counsellor_signature: counsellorSignature,
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    alert("✅ Report submitted successfully!");
                    window.location.href = `report.html?session_id=${sessionId}`;
                } else {
                    alert(`⚠️ Failed to submit report: ${data.error || "Unknown error"}`);
                }
            } catch (error) {
                console.error("❌ Error submitting report:", error);
                alert("❌ Error submitting report. Check console for details.");
            }
        });
    </script>
</body>
