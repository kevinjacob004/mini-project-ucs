<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counselling Report</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #2b2b2b;
            color: white;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            position: fixed; /* Fix the sidebar */
            height: 100vh; /* Full height */
        }

        .sidebar h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin: 15px 0;
        }

        .sidebar ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            display: flex;
            align-items: center;
        }

        .sidebar ul li a i {
            margin-right: 10px;
        }

        .main-content {
            margin-left: 250px; /* Offset by sidebar width */
            flex: 1;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 20px;
        }

        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #34495e;
        }

        #viewReportDetails {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #viewReportDetails p {
            margin: 10px 0;
            font-size: 16px;
            color: #2c3e50;
        }

        #viewReportDetails span {
            font-weight: 500;
            color: #34495e;
        }

        .back-button {
            background-color: #007bff;
            margin-top: 20px;
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <h2>Campus System</h2>
        <ul>
            <li><a href="homepage.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="dash.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="#"><i class="fas fa-utensils"></i> Canteen</a></li>
            <li><a href="counselling.html"><i class="fas fa-user-md"></i> Counselling</a></li>
            <li><a href="community.html"><i class="fas fa-users"></i> Community</a></li>
            <li><a href="index.html" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </aside>

    <div class="main-content">
        <h1 id="reportTitle">Counselling Report</h1>
        <div id="writeReportForm" style="display: none;">
            <form id="reportForm">
                <input type="hidden" id="sessionId">
                <label>Student Name:</label>
                <input type="text" id="studentName" required>
                <label>Student Age:</label>
                <input type="number" id="studentAge" required>
                <label>Problem Details:</label>
                <textarea id="problemDetails" required></textarea>
                <label>Solution Provided:</label>
                <textarea id="solution" required></textarea>
                <button type="submit">Submit Report</button>
            </form>
        </div>
        <div id="viewReportDetails" style="display: none;">
            <h2>Report Details</h2>
            <p><strong>Student Name:</strong> <span id="viewStudentName"></span></p>
            <p><strong>Student Age:</strong> <span id="viewStudentAge"></span></p>
            <p><strong>Problem Details:</strong> <span id="viewProblemDetails"></span></p>
            <p><strong>Solution Provided:</strong> <span id="viewSolution"></span></p>
            <button class="back-button" onclick="window.location.href = 'counselling.html';">Back to Counselling</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get("session_id");
            document.getElementById("sessionId").value = sessionId;

            const token = sessionStorage.getItem("token");
            if (!token) {
                alert("❌ You are not logged in. Redirecting to login...");
                window.location.href = "auth.html";
                return;
            }

            // Fetch report details for the session_id
            try {
                const response = await fetch(`https://unified-campus-system.onrender.com/api/report/${sessionId}`, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                    },
                });

                // Check if the response is OK (status code 200-299)
                if (response.ok) {
                    const report = await response.json();
                    displayReportDetails(report);
                } else if (response.status === 404) {
                    // If no report exists, display the "write" form
                    displayWriteReportForm();
                } else {
                    // Handle other errors
                    const errorText = await response.text(); // Log the response text for debugging
                    console.error("❌ Error fetching report:", errorText);
                    alert("❌ Error fetching report. Check console for details.");
                }
            } catch (error) {
                console.error("❌ Error fetching report:", error);
                alert("❌ Error fetching report. Check console for details.");
            }
        });

        function displayWriteReportForm() {
            document.getElementById("writeReportForm").style.display = "block";
            document.getElementById("reportTitle").textContent = "Write Counselling Report";
        }

        function displayReportDetails(report) {
            document.getElementById("viewReportDetails").style.display = "block";
            document.getElementById("reportTitle").textContent = "View Counselling Report";

            document.getElementById("viewStudentName").textContent = report.student_name;
            document.getElementById("viewStudentAge").textContent = report.student_age;
            document.getElementById("viewProblemDetails").textContent = report.problem_details;
            document.getElementById("viewSolution").textContent = report.solution;
        }

        document.getElementById("reportForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const sessionId = document.getElementById("sessionId").value;
            const studentName = document.getElementById("studentName").value;
            const studentAge = document.getElementById("studentAge").value;
            const problemDetails = document.getElementById("problemDetails").value;
            const solution = document.getElementById("solution").value;

            const token = sessionStorage.getItem("token");
            if (!token) {
                alert("❌ You are not logged in. Redirecting to login...");
                window.location.href = "auth.html";
                return;
            }

            try {
                const response = await fetch("https://unified-campus-system.onrender.com/api/report/add-report", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`,
                    },
                    body: JSON.stringify({
                        counselling_id: sessionId,
                        student_name: studentName,
                        student_age: studentAge,
                        problem_details: problemDetails,
                        solution: solution,
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    alert("✅ Report submitted successfully!");
                    window.location.href = `report.html?session_id=${sessionId}`; // Redirect to view mode
                } else {
                    alert(`⚠️ Failed to submit report: ${data.error || "Unknown error"}`);
                }
            } catch (error) {
                console.error("❌ Error submitting report:", error);
                alert("❌ Error submitting report. Check console for details.");
            }
        });
    </script>
</body>

</html>
