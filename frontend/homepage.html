<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home - Unified Campus System</title>
  <link rel="shortcut icon" href="./static/1.png" type="image/x-icon">


  <style>
    body {
      background-image: url("./static/giphy.gif");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      height: 100vh;
      margin: 0;
      font-family: 'Roboto', sans-serif;
    }

    /* Main Content */
    .main-content {
      margin-left: 270px;
      padding: 20px;
      min-height: 100vh;
      background-image: url('./static/giphy.gif');
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .profile-btn {
      background-color: #3498db;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    .profile-btn:hover {
      background-color: #2980b9;
    }

    /* Dashboard Overview */
    .dashboard-overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: #ecf0f1;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .card h3 {
      margin: 5px 0;
      color: #2c3e50;
    }

    .card p {
      font-size: 18px;
      font-weight: bold;
      color: #3498db;
    }

    /* Quick Actions */
    .quick-actions {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .actions button {
      background: #2ecc71;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .actions button:hover {
      background: #27ae60;
    }

    /* User Management (Admin Panel) */
    #admin-user-management {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
    }

    #admin-user-management h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    thead {
      background: #34495e;
      color: white;
    }

    th,
    td {
      padding: 12px;
      text-align: left;
    }

    tbody tr:nth-child(even) {
      background: #f2f2f2;
    }

    tbody tr:hover {
      background: #ddd;
    }
  </style>

  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
  <!-- Add Socket.IO client library -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>

<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Campus System</h2>
      <ul>
        <li>
          <a href="homepage.html"><i class="fas fa-home"></i> Home</a>
        </li>
        <li>
          <a href="dash.html"><i class="fas fa-home"></i> Dashboard</a>
        </li>
        <li>
          <a href="canteen.html"><i class="fas fa-utensils"></i> Canteen</a>
        </li>
        <li>
          <a href="counselling.html"><i class="fas fa-user-md"></i> Counseling</a>
        </li>
        <li>
          <a href="community.html"><i class="fas fa-users"></i> Community</a>
        </li>
        <li>
          <a href="index.html" class="logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header>
        <h1 id="welcome-message">Welcome, User</h1>
        <button class="profile-btn" onclick="gotoProfile()">
          <i class="fas fa-user-circle"></i> Profile
        </button>
      </header>

      <!-- Dashboard Overview -->
      <section class="dashboard-overview">
        <div class="card">
          <h3>Total Users</h3>
          <p id="total-students"></p>
        </div>
        <div class="card">
          <h3>Active Orders</h3>
          <p>78</p>
        </div>
        <div class="card">
          <h3>Counseling Sessions</h3>
          <p>25</p>
        </div>
        <div class="card">
          <h3>Community Posts</h3>
          <p>320</p>
        </div>
      </section>

      <!-- Quick Actions -->
      <section class="quick-actions">
        <h2>Quick Actions</h2>
        <div class="actions">
          <a href="canteen.html"><button>Order Food</button></a>
          <a href="counselling.html"><button>Book Counseling</button></a>
          <a href="community.html"><button>Community</button></a>
        </div>
      </section>

      <!-- User Management Section (Visible only to Admins) -->
      <section id="admin-user-management" style="display: none;">
        <h2>User Management</h2>
        <table>
          <thead>
            <tr>
              <th>User ID</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
              <th>Role</th>
            </tr>
          </thead>
          <tbody id="user-list"></tbody>
        </table>
      </section>


    </main>
  </div>

  <script>
    function gotoProfile() {
      window.location.href = "profile.html"
    }
    // Function to fetch total students from the backend
    async function fetchTotalStudents() {
      try {
        const response = await fetch('https://unified-campus-system.onrender.com/api/homepage/total-students'); // Call the API endpoint
        if (!response.ok) {
          throw new Error('Failed to fetch total students');
        }
        const data = await response.json(); // Parse the JSON response
        return data.total_students; // Return the total number of students
      } catch (error) {
        console.error('Error fetching total students:', error);
        return 0; // Return 0 if there's an error
      }
    }

    // Function to update the total students card
    async function updateTotalStudents() {
      const totalStudents = await fetchTotalStudents(); // Fetch total students
      const totalStudentsElement = document.getElementById('total-students'); // Select the <p> element
      if (totalStudentsElement) {
        totalStudentsElement.textContent = totalStudents; // Update the content
      }
    }

    // Call the function to update the total students when the page loads
    document.addEventListener('DOMContentLoaded', updateTotalStudents);

    // Retrieve the logged-in user's name from sessionStorage
    const username = sessionStorage.getItem("username");
    const fname = sessionStorage.getItem("fname");

    // Update the welcome message
    const welcomeMessage = document.getElementById("welcome-message");
    if (fname) {
      welcomeMessage.textContent = `Welcome, ${fname}`;
    } else if (username) {
      welcomeMessage.textContent = `Welcome, ${username}`;
    } else {
      welcomeMessage.textContent = "Welcome, User";
    }

    function logout() {
      // Clear user information from sessionStorage
      sessionStorage.removeItem("username");
      sessionStorage.removeItem("fname");
      sessionStorage.removeItem("lname");
      sessionStorage.removeItem("id");

      // Redirect to the login page
      window.location.href = "auth.html";
    }

    // Handle logout
    document.querySelector(".logout").addEventListener("click", () => {
      // Clear sessionStorage
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("username");
      sessionStorage.removeItem("fname");
      sessionStorage.removeItem("lname");
      sessionStorage.removeItem("id");
      sessionStorage.removeItem("role");
      sessionStorage.removeItem("email");

      // Redirect to the login page
      window.location.href = "auth.html";
    });

    // Function to fetch all users (Admin Only)
    async function fetchAllUsers() {
      try {
        const token = sessionStorage.getItem("token");
        const role = sessionStorage.getItem("role");
        const response = await fetch("https://unified-campus-system.onrender.com/api/homepage/all-users", {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`, "Content-Type": "application/json",
            "Role": role
          },
        });

        if (!response.ok) throw new Error("Failed to fetch users");

        const data = await response.json();
        displayUsers(data.users);
      } catch (error) {
        console.error("Error fetching users:", error);
      }
    }

    // Function to display users in the table
    function displayUsers(users) {
      const userList = document.getElementById("user-list");
      userList.innerHTML = ""; // Clear previous data

      users.forEach(user => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.first_name}</td>
            <td>${user.last_name}</td>
            <td>${user.email}</td>
            <td>${user.role}</td>
        `;
        userList.appendChild(row);
      });
    }

    // Check user role and display user management for admin
    document.addEventListener("DOMContentLoaded", () => {
      const role = sessionStorage.getItem("role");
      if (role === 'student' || role === 'admin' || role === 'counselor' || role === 'canteen_staff') {
        if (role === "admin") {
          document.getElementById("admin-user-management").style.display = "block";
          fetchAllUsers();
        }
      }
      else {
        window.location.href = "auth.html"

      }
    });
    const socket = io("https://unified-campus-system.onrender.com");
    const userId = sessionStorage.getItem("id"); // Assuming you store the user ID in localStorage
    console.log(userId);
    if (userId) {
      socket.emit("join", userId);
    }

    // Listen for new notifications
    socket.on("newNotification", (notification) => {
      showNotification(notification.title, notification.body);
    });

    // Function to show the notification as a pop-up
    function showNotification(title, message) {
      // Create a notification pop-up (if browser supports Notification API)
      if (Notification.permission === "granted") {
        new Notification(title, { body: message });
      }
      else {
        // If Notification API is not supported or permission is denied, use an alert
        alert(`${title}: ${message}`);
      }
    }

    // Request permission for browser notifications
    if (Notification.permission !== "granted") {
      Notification.requestPermission();
    }


  </script>
</body>

</html>
