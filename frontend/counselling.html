    <script>
        // Initialize Socket.IO
        const socket = io("https://unified-campus-system.onrender.com");
        // 🔥 Update UI when a new slot is booked
        socket.on("newSlotBooked", (booking) => {
            //alert(`New counselling slot booked at ${booking.session_date_time}`);
            fetchBookedSlots(); // Refresh booked slots
            fetchAllBookedSlots();
            fetchStudentBookedSlots();
        });

        // 🔥 Update UI when a slot is cancelled
        socket.on("slotCancelled", ({ sessionId }) => {
            //alert(`A counselling slot was cancelled!`);
            fetchBookedSlots(); // Refresh booked slots
            fetchAllBookedSlots();
            fetchStudentBookedSlots();
        });

        // 🔥 Update UI when a remark is added
        socket.on("remarkAdded", ({ session_id, remark }) => {
            //alert(`Remark added for session ${session_id}: ${remark}`);
            fetchBookedSlots(); // Refresh booked slots
            fetchAllBookedSlots();
            fetchStudentBookedSlots();
        });

        // 🔥 Update UI when feedback is added
        socket.on("feedbackAdded", ({ session_id, feedback }) => {
            //alert(`Feedback added for session ${session_id}: ${feedback}`);
            fetchBookedSlots(); // Refresh booked slots
            fetchAllBookedSlots();
            fetchStudentBookedSlots();
        });


        async function loadAvailableCounsellors() {
            try {
                const role = sessionStorage.getItem('role');
                console.log(role);

                const response = await fetch("https://unified-campus-system.onrender.com/api/counselling/available-counsellors");
                if (!response.ok) {
                    throw new Error("Failed to fetch counsellors");
                }

                const counsellors = await response.json();
                console.log("Counsellors Loaded:", counsellors); // Debugging log

                const counsellorSelect = document.getElementById("counsellorSelect");
                counsellorSelect.innerHTML = ""; // Clear previous options

                if (counsellors.length === 0) {
                    const option = document.createElement("option");
                    option.textContent = "No counsellors available";
                    option.disabled = true;
                    counsellorSelect.appendChild(option);
                    return;
                }

                counsellors.forEach(counsellor => {
                    const option = document.createElement("option");
                    option.value = counsellor.id;
                    option.textContent = `${counsellor.first_name} ${counsellor.last_name}`;
                    counsellorSelect.appendChild(option);
                });
            } catch (error) {
                console.error("Error loading counsellors:", error);
            }
        }

        function checkUserRole() {
            const role = sessionStorage.getItem("role");
            console.log(role);
            if (role === "student") {
                document.getElementById("studentView").style.display = "block";
                fetchStudentBookedSlots(); // Fetch student bookings
                loadAvailableCounsellors();
                loadAvailableSlots();
            } else if (role === "counselor") {
                document.getElementById("counsellorView").style.display = "block";
                fetchBookedSlots();
            } else if (role === "admin") {
                document.getElementById("adminView").style.display = "block";
                fetchAllBookedSlots(); // Fetch all booked slots for admin
            }
            else if (role === 'canteen_staff') {
                console.log("Not Available");
            }
            else {
                window.location.href = "auth.html"
            }
        }

        async function fetchAllBookedSlots() {
            try {
                const role = sessionStorage.getItem("role");
                const token = sessionStorage.getItem("token");
                const response = await fetch("https://unified-campus-system.onrender.com/api/counselling/all-booked-slots", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json",
                        "Role": role
                    },
                });

                if (!response.ok) throw new Error("Failed to fetch booked slots");

                const slots = await response.json();
                const slotsContainer = document.getElementById("adminBookedSlots");
                slotsContainer.innerHTML = "";

                if (slots.length === 0) {
                    slotsContainer.innerHTML = "<li>No booked slots found.</li>";
                    return;
                }

                slots.forEach(slot => {
                    const formattedDateTime = slot.session_date_time.replace("T", " ").replace("Z", "");

                    const li = document.createElement("li");
                    li.style.padding = "10px";
                    li.style.marginBottom = "10px";
                    li.style.borderRadius = "6px";
                    li.style.backgroundColor = "#f4f4f9";
                    li.style.boxShadow = "0 2px 5px rgba(0, 0, 0, 0.1)";

                    li.innerHTML = `
                <div><strong>👤 Student:</strong> ${slot.Student.first_name} ${slot.Student.last_name}</div>
                <div><strong>👨‍⚕️ Counsellor:</strong> ${slot.Counsellor.first_name} ${slot.Counsellor.last_name}</div>
                <div><strong>⏰ Time:</strong> ${formattedDateTime}</div>
                <div><strong>📝 Remark:</strong> <span style="color: ${slot.remark ? 'green' : 'gray'};">${slot.remark || 'No remark yet'}</span></div>
                <div><strong>💬 Feedback:</strong> <span style="color: ${slot.feedback ? 'green' : 'gray'};">${slot.feedback || 'No feedback yet'}</span></div>
                                   <button onclick="redirectToReport(${slot.session_id})"
                        style="background-color: #007bff; color: white; padding: 6px 10px; border: none; border-radius: 5px; margin-top: 5px; cursor: pointer;">
                        Report
                    </button>
            `;

                    slotsContainer.appendChild(li);
                });
            } catch (error) {
                console.error("Error fetching admin booked slots:", error);
            }
        }

        function viewReport(reportId) {
            window.location.href = `report.html?report_id=${reportId}`;
        }


        function loadAvailableSlots() {
            const startTime = new Date();
            startTime.setHours(9, 30, 0, 0); // ✅ Set exact time (9:30 AM)

            const endTime = new Date();
            endTime.setHours(16, 0, 0, 0); // ✅ Set exact time (4:00 PM)

            const slotsContainer = document.getElementById("slots");
            slotsContainer.innerHTML = "";

            while (startTime <= endTime) {
                const slotTime = new Date(startTime); // ✅ Create a copy to avoid mutation

                // 🔹 Format time correctly using `toLocaleTimeString`
                const slotButton = document.createElement("button");
                slotButton.textContent = slotTime.toLocaleTimeString("en-US", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true, // ✅ Ensures AM/PM format
                });

                slotButton.onclick = () => bookSlot(slotTime.toISOString()); // ✅ Pass full ISO string for accuracy
                slotsContainer.appendChild(slotButton);

                startTime.setMinutes(startTime.getMinutes() + 30); // ✅ Increment by 30 minutes
            }
        }


        async function bookSlot() {
            const studentId = sessionStorage.getItem("id");
            const counsellorId = document.getElementById("counsellorSelect").value;
            const selectedDate = document.getElementById("datePicker").value; // Get selected date
            const selectedTime = document.getElementById("timePicker").value; // Get selected time

            if (!studentId) return alert("❌ Please log in first!");
            if (!counsellorId) return alert("❌ Please select a counsellor!");
            if (!selectedDate) return alert("❌ Please select a date!");
            if (!selectedTime) return alert("❌ Please select a time!");

            // 🔹 Get current date and time
            const now = new Date();
            const selectedDateTime = new Date(`${selectedDate}T${selectedTime}:00`);

            // 🔹 Check if the selected date is today
            const today = now.toISOString().split("T")[0]; // Get current date in "YYYY-MM-DD"

            if (selectedDate < today) {
                return alert("❌ You cannot book past dates!");
            }

            // 🔹 Ensure the time is not before the current time if booking for today
            if (selectedDate === today && selectedDateTime <= now) {
                return alert("❌ You cannot book past time slots for today!");
            }


            //Time difference correction if required!!
            //selectedDateTime.setHours(selectedDateTime.getHours() + 11);



            // ✅ Format date-time for MySQL (YYYY-MM-DD HH:MM:SS)
            const formattedDateTime = selectedDateTime.getFullYear() + "-" +
                String(selectedDateTime.getMonth() + 1).padStart(2, "0") + "-" +
                String(selectedDateTime.getDate()).padStart(2, "0") + " " +
                String(selectedDateTime.getHours()).padStart(2, "0") + ":" +
                String(selectedDateTime.getMinutes()).padStart(2, "0") + ":00";



            console.log("📌 Debugging: Adjusted Time →", formattedDateTime); // Debugging output

            try {
                const response = await fetch("https://unified-campus-system.onrender.com/api/counselling/book-slot", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        student_id: studentId,
                        counsellor_id: counsellorId,
                        session_date_time: formattedDateTime // ✅ Sends corrected time
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    alert("✅ Slot booked successfully!");
                    window.location.reload();
                } else {
                    alert(data.error || "⚠️ Failed to book slot");
                }
            } catch (error) {
                console.error("❌ Error booking slot:", error);
                alert("❌ Error booking slot. Try again.");
            }
        }


        document.addEventListener("DOMContentLoaded", () => {
            // Get today's date
            const today = new Date();

            // Calculate the date 3 days from today
            const maxDate = new Date(today);
            maxDate.setDate(today.getDate() + 5);

            // Format today and maxDate as YYYY-MM-DD
            const todayFormatted = today.toISOString().split("T")[0];
            const maxDateFormatted = maxDate.toISOString().split("T")[0];

            // Set the min and max attributes of the date picker
            const datePicker = document.getElementById("datePicker");
            datePicker.setAttribute("min", todayFormatted); // Disable past dates
            datePicker.setAttribute("max", maxDateFormatted); // Set maximum date to 3 days from today

            // Add event listener to validate the selected date
            datePicker.addEventListener("change", () => {
                const selectedDate = new Date(datePicker.value);
                const dayOfWeek = selectedDate.getDay(); // 0 = Sunday, 6 = Saturday

                const errorMessage = document.getElementById("errorMessage");

                // Check if the selected date is a Saturday or Sunday
                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    errorMessage.textContent = "Saturdays and Sundays are not allowed. Please select another date.";
                    datePicker.value = ""; // Reset the date picker
                }
                else {
                    errorMessage.textContent = ""; // Clear error message
                }
            });
        });

                    const formattedDateTime = slot.session_date_time.replace("T", " ").replace("Z", "");

                    const li = document.createElement("li");
                    li.style.padding = "10px";

                    li.style.borderRadius = "6px";
                    li.style.backgroundColor = "#f4f4f9";
                    li.style.boxShadow = "0 2px 5px rgba(0, 0, 0, 0.1)";

                    li.innerHTML = `
                <div><strong>👤 Student:</strong> ${slot.Student.first_name} ${slot.Student.last_name}</div>
                <div><strong>⏰ Time:</strong> ${formattedDateTime}</div>

                <div><strong>💬 Feedback:</strong> <span style="color: ${slot.feedback ? 'green' : 'gray'};">

                ${!slot.remark ? `

                    <button onclick="redirectToReport(${slot.session_id})"

        function redirectToReport(sessionId) {
            window.location.href = `report.html?session_id=${sessionId}`;

                </div>
                <div style="margin-bottom: 5px;">
                    <strong style="color: #2c3e50;">📝 Remark:</strong>

                </div>
                <div style="margin-bottom: 5px;">
                    <strong style="color: #2c3e50;">💬 Feedback:</strong>

        async function cancelSlot(sessionId) {
            if (!confirm("Are you sure you want to cancel this slot?")) return;

            try {
                const response = await fetch(`https://unified-campus-system.onrender.com/api/counselling/cancel-slot/${sessionId}`, {
                    method: "DELETE",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${sessionStorage.getItem("token")}`,
                    },
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "Failed to cancel slot");
                }

                alert("Slot cancelled successfully!");
                fetchStudentBookedSlots(); // Refresh the list of booked slots
            } catch (error) {
                console.error("Error cancelling slot:", error);
                alert(error.message || "Failed to cancel slot. Please try again.");
            }
        }

        async function submitFeedback(sessionId) {
            const feedbackText = document.getElementById(`feedback-${sessionId}`).value.trim();
            if (!feedbackText) return alert("Feedback cannot be empty!");

            try {
                const response = await fetch(`https://unified-campus-system.onrender.com/api/counselling/add-feedback/${sessionId}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${sessionStorage.getItem("token")}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ feedback: feedbackText }),
                });

                if (!response.ok) throw new Error("Failed to submit feedback");

                alert("Feedback submitted successfully!");
                fetchStudentBookedSlots(); // ✅ Refresh the list
            } catch (error) {
                console.error("Error submitting feedback:", error);
                alert("Error submitting feedback. Try again.");
            }
        }

                fetchStudentBookedSlots(); // ✅ Refresh the list
            } catch (error) {
                console.error("Error submitting feedback:", error);
                alert("Error submitting feedback. Try again.");
            }
        }



        async function submitRemark(sessionId) {
            const remarkText = document.getElementById(`remark-${sessionId}`).value.trim();
            if (!remarkText) return alert("Remark cannot be empty!");

            try {
                const response = await fetch(`https://unified-campus-system.onrender.com/api/counselling/add-remark/${sessionId}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${sessionStorage.getItem("token")}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ remark: remarkText }),
                });

                if (!response.ok) throw new Error("Failed to submit remark");

                alert("Remark submitted successfully!");
                fetchBookedSlots(); // ✅ Refresh the list for counsellors
            } catch (error) {
                console.error("Error submitting remark:", error);
                alert("Error submitting remark. Try again.");
            }
        }

        // Handle logout
        document.querySelector(".logout").addEventListener("click", () => {
            // Clear sessionStorage
            sessionStorage.removeItem("token");
            sessionStorage.removeItem("username");
            sessionStorage.removeItem("fname");
            sessionStorage.removeItem("lname");
            sessionStorage.removeItem("id");
            sessionStorage.removeItem("role");
            sessionStorage.removeItem("email");

            // Redirect to the login page
            window.location.href = "auth.html";
        });

        const userId = sessionStorage.getItem("id"); // Assuming you store the user ID in localStorage
        console.log(userId);
        if (userId) {
            socket.emit("join", userId);
        }

        // Listen for new notifications
        socket.on("newNotification", (notification) => {
            showNotification(notification.title, notification.body);
        });

        // Function to show the notification as a pop-up
        function showNotification(title, message) {
            // Create a notification pop-up (if browser supports Notification API)
            if (Notification.permission === "granted") {
                new Notification(title, { body: message });
            }
            else {
                // If Notification API is not supported or permission is denied, use an alert
                alert(`${title}: ${message}`);
            }
        }

        // Request permission for browser notifications
        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }


    </script>
