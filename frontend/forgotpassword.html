<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - UCS</title>
    <link rel="shortcut icon" href="./static/1.png" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            background-image: url('./static/lg-bg1.png');
            background-size: cover;
            background-position: center;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            background: #6e7fdb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #4a63a0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Forgot Password</h2>

        <!-- Step 1: Enter Email & Username -->
        <div id="step1">
            <input type="email" id="email" placeholder="Enter your email" required>
            <input type="text" id="username" placeholder="Enter your username" required>
            <button onclick="sendOTP()">Send OTP</button>
        </div>

        <!-- Step 2: Enter OTP -->
        <div id="step2" style="display: none;">
            <input type="text" id="otp" placeholder="Enter OTP" required>
            <button onclick="verifyOTP()">Verify OTP</button>
        </div>

        <!-- Step 3: Reset Password -->
        <div id="step3" style="display: none;">
            <input type="password" id="newPassword" placeholder="Enter new password" required>
            <button onclick="resetPassword()">Reset Password</button>
        </div>
    </div>

    <script>
        let userEmail = "";

        // 🔹 Step 1: Send OTP
        async function sendOTP() {
            userEmail = document.getElementById("email").value;
            const username = document.getElementById("username").value;

            const response = await fetch("https://unified-campus-system.onrender.com/api/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: userEmail, username }),
            });

            const data = await response.json();
            if (response.ok) {
                alert("OTP sent to your email!");
                document.getElementById("step1").style.display = "none";
                document.getElementById("step2").style.display = "block";
            } else {
                alert(data.error);
            }
        }

        // 🔹 Step 2: Verify OTP
        async function verifyOTP() {
            const otp = document.getElementById("otp").value;

            const response = await fetch("https://unified-campus-system.onrender.com/api/auth/verify-otp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: userEmail, otp }),
            });

            const data = await response.json();
            if (response.ok) {
                alert("OTP verified successfully!");
                document.getElementById("step2").style.display = "none";
                document.getElementById("step3").style.display = "block";
            } else {
                alert(data.error);
            }
        }

        // 🔹 Step 3: Reset Password
        async function resetPassword() {
            const newPassword = document.getElementById("newPassword").value;

            const response = await fetch("https://unified-campus-system.onrender.com/api/auth/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: userEmail, newPassword }),
            });

            const data = await response.json();
            if (response.ok) {
                alert("Password reset successful! Redirecting to login...");
                window.location.href = "auth.html";
            } else {
                alert(data.error);
            }
        }
    </script>
</body>

</html>
