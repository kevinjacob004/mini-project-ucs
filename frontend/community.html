    body {

    /* 🔹 Post Styling */
    .post {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.1);
      padding: 15px;
      margin-bottom: 20px;
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .post:hover {
      transform: translateY(-3px);
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.15);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    .user-info {
      display: flex;
      align-items: center;
      font-weight: bold;
    }

    .user-info i {
      font-size: 20px;
      margin-right: 5px;
      color: #007bff;
    }

    .timestamp {
      font-size: 12px;
      color: gray;
    }

    .post-title {
      font-size: 18px;
      font-weight: bold;
      margin: 5px 0;
      color: #333;
    }

    .post-content {
      font-size: 14px;
      color: #555;
      margin-bottom: 10px;
    }

    .post-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .post-actions button {
      background: #007bff;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .post-actions .delete-post-btn {
      background: #dc3545;
    }

    /* 🔹 Comment Styling */
    .comment {
      background: #f8f9fa;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      border-left: 4px solid #007bff;
      transition: background 0.2s ease-in-out;
    }

    .comment:hover {
      background: #eef2ff;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .comment-content {
      font-size: 14px;
      color: #444;
      margin: 5px 0;
    }

    .comment-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .comment-actions .delete-comment-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    async function fetchPosts() {
      try {
        const response = await fetch("https://unified-campus-system.onrender.com/api/community/threads");
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        const threads = await response.json();
        console.log("Fetched threads:", threads); // Debugging

        // Determine the post feed container based on the user's role
        const userRole = sessionStorage.getItem("role"); // Logged-in user's role
        const postFeedId = userRole === "admin" ? "post-feed" : "post-feed";
        const postFeed = document.getElementById(postFeedId);

        postFeed.innerHTML = ""; // Clear existing posts

        threads.forEach((thread) => {
          const postElement = document.createElement("div");
          postElement.classList.add("post");

          const deleteButton =
            userRole === "admin" || thread.user_id === parseInt(sessionStorage.getItem("id"))
              ? `<button class="delete-post-btn" data-thread-id="${thread.thread_id}">🗑 Delete Post</button>`
              : "";


          postElement.innerHTML = `
                <h3>${thread.User.first_name} ${thread.User.last_name} 
                    <span class="timestamp">${new Date(thread.created_at).toLocaleString()}</span>
                </h3>
                <h4>${thread.title}</h4>
                <p>${thread.content}</p>
                ${deleteButton}
                <button class="view-comments-btn" data-thread-id="${thread.thread_id}">💬 View Comments</button>
                <div class="comment-section">
                    <input type="text" class="comment-input" placeholder="Write a comment..." />
                    <button class="comment-btn" data-thread-id="${thread.thread_id}">➕ Add Comment</button>
                </div>
                <div class="comments-container" id="comments-${thread.thread_id}" style="display: none;">
                    <!-- Comments will be dynamically inserted here -->
                </div>
            `;

          postFeed.appendChild(postElement);

          // Add animation for better UI
          setTimeout(() => {
            postElement.classList.add("show");
          }, 10);
        });

      } catch (error) {
        console.error("Error fetching threads:", error);
        alert("Failed to fetch posts. Please try again later.");
      }
    }

    async function fetchComments(thread_id) {
      try {
        const response = await fetch(`https://unified-campus-system.onrender.com/api/community/threads/${thread_id}/messages`);
        if (!response.ok) {
          throw new Error("Failed to fetch comments");
        }

        const comments = await response.json();
        const userRole = sessionStorage.getItem("role"); // Logged-in user's role
        const commentsContainer = document.getElementById(`comments-${thread_id}`);
        commentsContainer.innerHTML = "";

        comments.forEach((comment) => {
          const deleteCommentButton = userRole === "admin" || comment.user_id === parseInt(sessionStorage.getItem("id"))
            ? `<button class="delete-comment-btn" data-comment-id="${comment.message_id}">🗑 Delete</button>`
            : "";

          const commentElement = document.createElement("div");
          commentElement.classList.add("comment");

          commentElement.innerHTML = `
                <p><strong>${comment.User.first_name} ${comment.User.last_name}</strong>: ${comment.message_content}</p>
                <span class="timestamp">${new Date(comment.created_at).toLocaleString()}</span>
                ${deleteCommentButton}
            `;

          commentsContainer.appendChild(commentElement);
        });

      } catch (error) {
        console.error("Error fetching comments:", error);
      }
    }



    document.getElementById("post-feed").addEventListener("click", async (e) => {
      if (e.target.classList.contains("delete-post-btn")) {
        const thread_id = e.target.getAttribute("data-thread-id");
        await deletePost(thread_id);
      }

      if (e.target.classList.contains("delete-comment-btn")) {
        const message_id = e.target.getAttribute("data-comment-id");
        await deleteComment(message_id);
      }
    });

    // 🔹 Delete Post
    async function deletePost(thread_id) {


      if (!confirm("Are you sure you want to delete this post? This will also delete all comments.")) return;

      try {
        const token = sessionStorage.getItem("token");
        const role = sessionStorage.getItem("role");
        const response = await fetch(`https://unified-campus-system.onrender.com/api/community/threads/${thread_id}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}`, "Role": role }
        });

        if (!response.ok) throw new Error("Failed to delete post");

        alert("Post deleted successfully!");
        fetchPosts();
      } catch (error) {
        console.error("Error deleting post:", error);
      }
    }

    // 🔹 Delete Comment
    async function deleteComment(message_id) {
      if (!confirm("Are you sure you want to delete this comment?")) return;

      try {
        const token = sessionStorage.getItem("token");
        const role = sessionStorage.getItem("role");
        const response = await fetch(`https://unified-campus-system.onrender.com/api/community/messages/${message_id}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}`, "Role": role }
        });

        if (!response.ok) throw new Error("Failed to delete comment");

        alert("Comment deleted successfully!");
        fetchPosts();
      } catch (error) {
        console.error("Error deleting comment:", error);
      }
    }

    // Handle post (thread) creation
    document.querySelector(".post-btn").addEventListener("click", async () => {
      const title = document.getElementById("post-title").value;
      const content = document.getElementById("post-content").value;

      if (!title || !content) {
        alert("Please enter a title and content to post.");
        return;
      }

      try {
        const token = sessionStorage.getItem("token");
        console.log("Token being sent:", token);

        if (!token) {
          alert("You are not logged in. Redirecting to login page...");
          window.location.href = "auth.html";
          return;
        }

        const response = await fetch("https://unified-campus-system.onrender.com/api/community/threads", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ title, content }),
        });

        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.error || "Failed to create post");
        }

        alert("Post created successfully!");
        fetchPosts(); // Refresh the post feed
      } catch (error) {
        console.error("Error creating post:", error);
        alert(error.message || "An error occurred while creating the post");
      }
    });

    // Handle comment (message) creation
    document.getElementById("post-feed").addEventListener("click", async (e) => {
      if (e.target.classList.contains("comment-btn")) {
        const thread_id = e.target.getAttribute("data-thread-id");
        const commentInput = e.target.previousElementSibling;
        const message_content = commentInput.value;

        if (!message_content) {
          alert("Please enter a comment.");
          return;
        }

        try {
          const token = sessionStorage.getItem("token");
          if (!token) {
            alert("You are not logged in. Redirecting to login page...");
            window.location.href = "auth.html";
            return;
          }

          const response = await fetch("https://unified-campus-system.onrender.com/api/community/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ thread_id, message_content }),
          });

          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.error || "Failed to add comment");
          }

          alert("Comment added successfully!");
          fetchComments(thread_id); // Refresh the comments
        } catch (error) {
          console.error("Error adding comment:", error);
          alert(error.message || "An error occurred while adding the comment");
        }
      }
    });

    // Add click event to "View Comments" button
    document.getElementById("post-feed").addEventListener("click", async (e) => {
      if (e.target.classList.contains("view-comments-btn")) {

          commentsContainer.style.display = "block";
          await fetchComments(thread_id); // Fetch comments if not already fetched
        } else {
          commentsContainer.style.display = "none";
        }
      }
    });

    // Handle logout
    document.querySelector(".logout").addEventListener("click", () => {
      // Clear sessionStorage
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("username");
      sessionStorage.removeItem("fname");
      sessionStorage.removeItem("lname");
      sessionStorage.removeItem("id");

      window.location.href = "auth.html";
