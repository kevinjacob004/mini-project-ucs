<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Unified Campus System</title>
    <link rel="shortcut icon" href="./static/1.png" type="image/x-icon">
    <!-- Add Socket.IO client library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            background-image: url("./static/giphy.gif");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            height: 100vh;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        /* Main Content */
        .main-content {
            margin-left: 270px;
            padding: 40px;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .profile-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-container h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .profile-box {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            text-align: left;
        }

        .profile-box div {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .profile-box div:last-child {
            border-bottom: none;
        }

        .profile-box h3 {
            font-size: 1.2rem;
            color: #34495e;
            margin: 0;
            flex: 1;
        }

        .profile-box span {
            font-size: 1.1rem;
            color: #7f8c8d;
            flex: 2;
            text-align: right;
        }

        .edit-form {
            display: none;
            /* Hidden by default */
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-top: 20px;
        }

        .edit-form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .edit-form button {
            background: #6e7fdb;
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px 20px;
            margin: 10px 5px;
            border-radius: 5px;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .edit-form button.cancel {
            background: #e74c3c;
        }

        .edit-form button:hover {
            opacity: 0.9;
        }

        button {
            background: #6e7fdb;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border-radius: 5px;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #4a63a0;
        }
    </style>

    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Campus System</h2>
            <ul>
                <li>
                    <a href="homepage.html"><i class="fas fa-home"></i> Home</a>
                </li>
                <li>
                    <a href="dash.html"><i class="fas fa-home"></i> Dashboard</a>
                </li>
                <li>
                    <a href="canteen.html"><i class="fas fa-utensils"></i> Canteen</a>
                </li>
                <li>
                    <a href="counselling.html"><i class="fas fa-user-md"></i> Counseling</a>
                </li>
                <li>
                    <a href="community.html"><i class="fas fa-users"></i> Community</a>
                </li>
                <li>
                    <a href="index.html" class="logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="profile-container">
                <div class="profile-box">
                    <h1>Profile</h1>
                    <div>
                        <h3>Name:</h3>
                        <span id="profile-name"></span>
                    </div>
                    <div>
                        <h3>Username:</h3>
                        <span id="profile-username"></span>
                    </div>
                    <div>
                        <h3>Branch:</h3>
                        <span id="profile-branch"></span>
                    </div>
                    <div>
                        <h3>Role:</h3>
                        <span id="profile-role"></span>
                    </div>
                    <div>
                        <h3>Email:</h3>
                        <span id="profile-email"></span>
                    </div>
                    <button onclick="toggleEditForm()">Edit Profile</button>
                </div>

                <!-- Edit Form -->
                <div class="edit-form" id="edit-form">
                    <h2>Edit Profile</h2>
                    <form id="edit-profile-form">
                        <label for="edit-fname">First Name:</label>
                        <input type="text" id="edit-fname" name="fname" required />

                        <label for="edit-lname">Last Name:</label>
                        <input type="text" id="edit-lname" name="lname" required />

                        <label for="edit-email">Email:</label>
                        <input type="email" id="edit-email" name="email" required />

                        <button type="button" onclick="saveChanges()">Save Changes</button>
                        <button type="button" class="cancel" onclick="toggleEditForm()">Cancel</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Fetch and display profile information
        function fetchinfo() {
            const fname = sessionStorage.getItem("fname");
            const lname = sessionStorage.getItem("lname");
            const role = sessionStorage.getItem("role");
            const id = sessionStorage.getItem("id");
            const email = sessionStorage.getItem("email");
            const username = sessionStorage.getItem("username");
            document.getElementById("profile-name").textContent = `${fname} ${lname}`;
            document.getElementById("profile-role").textContent = `${role}`;
            document.getElementById("profile-username").textContent = `${username}`;
            document.getElementById("profile-email").textContent = `${email}`;
            if (username && typeof username === 'string') {
                if (username.includes("CS")) {
                    document.getElementById("profile-branch").textContent = `Computer Science`;
                } else if (username.includes("EC")) {
                    document.getElementById("profile-branch").textContent = `Electronics and Communication`;
                }
                else if (username.includes("EI")) {
                    document.getElementById("profile-branch").textContent = `Electronics & Instramentation`;
                } else if (username.includes("ME")) {
                    document.getElementById("profile-branch").textContent = `Mechanical`;
                } else if (username.includes("CE")) {
                    document.getElementById("profile-branch").textContent = `Civil`;
                }
                else {
                    // Default case if neither "CS" nor "EC" is found
                    document.getElementById("profile-branch").textContent = 'Staff';
                }
            } else {
                console.error("Username is not defined or is not a string.");
            }
        }

        // Toggle edit form visibility
        function toggleEditForm() {
            const editForm = document.getElementById("edit-form");
            const profileBox = document.querySelector(".profile-box");
            if (editForm.style.display === "none" || !editForm.style.display) {
                editForm.style.display = "block";
                profileBox.style.display = "none";

                // Populate the form with current data
                const fname = sessionStorage.getItem("fname");
                const lname = sessionStorage.getItem("lname");
                const email = sessionStorage.getItem("email");
                document.getElementById("edit-fname").value = fname;
                document.getElementById("edit-lname").value = lname;
                document.getElementById("edit-email").value = email;
            } else {
                editForm.style.display = "none";
                profileBox.style.display = "block";
            }
        }

        // Save changes to sessionStorage
        async function saveChanges() {
            const fname = document.getElementById("edit-fname").value;
            const lname = document.getElementById("edit-lname").value;
            const email = document.getElementById("edit-email").value;

            // Validate input
            if (!fname || !lname || !email) {
                alert("All fields are required");
                return;
            }

            try {
                const response = await fetch("https://unified-campus-system.onrender.com/api/homepage/update-profile", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${sessionStorage.getItem("token")}`, // Include the JWT token for authentication
                    },
                    body: JSON.stringify({ fname, lname, email }),
                });

                const data = await response.json();
                console.log(data);
                if (response.ok) {
                    // Update sessionStorage with new data
                    sessionStorage.setItem("fname", fname);
                    sessionStorage.setItem("lname", lname);
                    sessionStorage.setItem("email", email);

                    // Update displayed profile information
                    fetchinfo();

                    // Hide the edit form and show the profile box
                    toggleEditForm();
                } else {
                    alert(data.error || "Failed to update profile");
                }
            } catch (error) {
                console.error("Error updating profile:", error);
                alert("An error occurred while updating the profile");
            }
        }

        // Logout function
        function logout() {
            sessionStorage.removeItem("token");
            sessionStorage.removeItem("username");
            sessionStorage.removeItem("fname");
            sessionStorage.removeItem("lname");
            sessionStorage.removeItem("id");
            sessionStorage.removeItem("role");
            sessionStorage.removeItem("email");
            window.location.href = "auth.html";
        }

        // Fetch profile info on page load
        document.addEventListener("DOMContentLoaded", () => {
            fetchinfo();
        });

        const socket = io("https://unified-campus-system.onrender.com");
        const userId = sessionStorage.getItem("id"); // Assuming you store the user ID in localStorage
        console.log(userId);
        if (userId) {
            socket.emit("join", userId);
        }

        // Listen for new notifications
        socket.on("newNotification", (notification) => {
            showNotification(notification.title, notification.body);
        });

        // Function to show the notification as a pop-up
        function showNotification(title, message) {
            // Create a notification pop-up (if browser supports Notification API)
            if (Notification.permission === "granted") {
                new Notification(title, { body: message });
            }
            else {
                // If Notification API is not supported or permission is denied, use an alert
                alert(`${title}: ${message}`);
            }
        }

        // Request permission for browser notifications
        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

    </script>
</body>

</html>
