<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canteen - Unified Campus System</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 210px;
            background-color: #2b2b2b;
            color: white;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            height: 100vh;
        }

        .sidebar h2 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin: 15px 0;
        }

        .sidebar ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            display: flex;
            align-items: center;
            padding: 10px;
        }

        .sidebar ul li a:hover {
            background-color: #3a3a3a;
            border-radius: 5px;
        }

        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .menu-container,
        .cart-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item button {
            background-color: #27ae60;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .menu-item button:hover {
            background-color: #219150;
        }

        .cart-container button {
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        .cart-container button:hover {
            background-color: #c0392b;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Campus System</h2>
        <ul>
            <li><a href="homepage.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="dash.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="canteen.html"><i class="fas fa-utensils"></i> Canteen</a></li>
            <li><a href="counselling.html"><i class="fas fa-user-md"></i> Counseling</a></li>
            <li><a href="community.html"><i class="fas fa-users"></i> Community</a></li>
            <li><a href="index.html" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </aside>

     <!-- Main Content -->
     <div class="main-content">
        <header>
            <h1>Canteen Menu</h1>
            <button class="profile-btn">Profile</button>
        </header>

        <!-- Cart Section -->
        <section class="cart-container" >
            <h2>Your Cart</h2>
            <ul id="cart-items"></ul>
            <p>Total: ₹<span id="total-price">0.00</span></p>
            <button onclick="placeOrder()">Place Order</button>
        </section>

        <!-- Add Menu Item Form (Visible only to Canteen Staff) -->
        <section id="adminPanel" style="display: none;">
            <h2>Canteen Staff Panel</h2>
            <button onclick="toggleAddItemForm()">➕ Add Item</button>
            <div id="addItemForm" style="display: none;">
                <h3>Add New Menu Item</h3>
                <input type="text" id="itemName" placeholder="Item Name" required />
                <input type="text" id="itemDescription" placeholder="Description" required />
                <input type="number" id="itemPrice" placeholder="Price" required />
                <input type="number" id="itemQuantity" placeholder="Quantity" required />
                <input type="time" id="availableFrom" required />
                <input type="time" id="availableTo" required />
                <button onclick="addMenuItem()">Add Item</button>
            </div>
        </section>

        <!-- Menu Section -->
        <section class="menu">
            <h2>Available Items</h2>
            <div id="menu-items"></div>
        </section>
    </div>

    <script>
        const apiUrl = "https://unified-campus-system.onrender.com/api/canteen"; // Adjust based on your backend

        // Check user role on page load
        function checkUserRole() {
            const role = sessionStorage.getItem("role");
            if (role === 'canteen_staff') {
                document.getElementById("adminPanel").style.display = "block";
            }
        }

        // Fetch menu items from the backend
        async function fetchMenu() {
            try {
                const response = await fetch(`${apiUrl}/fmenu`);
                const menu = await response.json();
                const menuContainer = document.getElementById("menu-items");
                menuContainer.innerHTML = "";
                if (menu.length === 0) {
                    menuContainer.innerHTML = "<p>No items available in the menu.</p>";
                    return;
                }
                menu.forEach(item => {
                    menuContainer.innerHTML += `
                        <div class="menu-item">
                            <h3>${item.item_name}</h3>
                            <p>${item.item_description}</p>
                            <p>₹${item.price}</p>
                            <p>Available: ${item.available_from} - ${item.available_to}</p>
                            <button onclick="addToCart(${item.menu_id}, '${item.item_name}', ${item.price})">Add to Cart</button>
                        </div>`;
                });
            } catch (error) {
                console.error("Error fetching menu:", error);
            }
        }

        // Add item to cart (to be implemented later)
        function addToCart(id, item, price) {
            alert(`Added ${item} (₹${price}) to cart.`);
        }

        // Add new menu item (Only for Canteen Staff)
        async function addMenuItem() {
            try {
                const item_name = document.getElementById("itemName").value;
                const item_description = document.getElementById("itemDescription").value;
                const price = document.getElementById("itemPrice").value;
                const quantity = document.getElementById("itemQuantity").value;
                const available_from = document.getElementById("availableFrom").value;
                const available_to = document.getElementById("availableTo").value;

                const response = await fetch(`${apiUrl}/menu`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${sessionStorage.getItem("token")}` },
                    body: JSON.stringify({ item_name, item_description, price, quantity, available_from, available_to })
                });

                if (response.ok) {
                    alert("✅ Item added successfully!");
                    fetchMenu();
                } else {
                    alert("❌ Failed to add item");
                }
            } catch (error) {
                console.error("❌ Error adding menu item:", error);
            }
        }

        // Toggle add item form visibility
        function toggleAddItemForm() {
            const form = document.getElementById("addItemForm");
            form.style.display = form.style.display === "none" ? "block" : "none";
        }

        // Initialize on page load
        document.addEventListener("DOMContentLoaded", () => {
            checkUserRole();
            fetchMenu();
            fetchCartItems(); // Fetch cart items

        });


        // Add item to cart
        async function addToCart(item_id, item_name, price) {
            try {
                const user_id = sessionStorage.getItem("id");
                if (!user_id) {
                    alert("Please log in to add items to the cart.");
                    return;
                }

                const response = await fetch(`${apiUrl}/cart/add`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${sessionStorage.getItem("token")}`
                    },
                    body: JSON.stringify({ user_id, item_id, quantity: 1, price })
                });

                if (!response.ok) {
                    throw new Error("Failed to add item to cart");
                }

                const data = await response.json();
                alert(`Added ${item_name} (₹${price}) to cart.`);
                fetchCartItems(); // Refresh the cart
            } catch (error) {
                console.error("Error adding item to cart:", error);
                alert("Failed to add item to cart.");
            }
        }

        // Fetch cart items
        async function fetchCartItems() {
            try {
                const user_id = sessionStorage.getItem("id");
                if (!user_id) return;

                const response = await fetch(`${apiUrl}/cart/${user_id}`, {
                    headers: { "Authorization": `Bearer ${sessionStorage.getItem("token")}` }
                });

                if (!response.ok) {
                    throw new Error("Failed to fetch cart items");
                }

                const cartItems = await response.json();
                const cartContainer = document.getElementById("cart-items");
                const totalPriceElement = document.getElementById("total-price");

                cartContainer.innerHTML = "";
                let totalPrice = 0;

                cartItems.forEach(item => {
                    console.log(`${item.id}`);
                    const cartItemElement = document.createElement("li");
                    cartItemElement.innerHTML = `
                        <span>${item.MenuItem.item_name} (Qty: ${item.quantity}) - ₹${item.price * item.quantity}</span>
                        <button onclick="removeFromCart(${item.id})">❌</button>
                    `;
                    cartContainer.appendChild(cartItemElement);
                    totalPrice += item.price * item.quantity;
                });

                totalPriceElement.textContent = totalPrice.toFixed(2);
            } catch (error) {
                console.error("Error fetching cart items:", error);
            }
        }


        

        // Remove item from cart
        async function removeFromCart(orderItemId) {
            try {
                console.log(`${orderItemId}`);
                const response = await fetch(`${apiUrl}/cart/remove/${orderItemId}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${sessionStorage.getItem("token")}` }
                });

                if (!response.ok) {
                    throw new Error("Failed to remove item from cart");
                }

                alert("Item removed from cart.");
                fetchCartItems(); // Refresh the cart
            } catch (error) {
                console.error("Error removing item from cart:", error);
            }
        }

        // Place order
        async function placeOrder() {
            try {
                const user_id = sessionStorage.getItem("id");
                if (!user_id) {
                    alert("Please log in to place an order.");
                    return;
                }

                const response = await fetch(`${apiUrl}/order/place`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${sessionStorage.getItem("token")}`
                    },
                    body: JSON.stringify({ user_id })
                });

                if (!response.ok) {
                    throw new Error("Failed to place order");
                }

                const orderData = await response.json();
                alert("Order placed successfully!");
                fetchCartItems(); // Refresh the cart
            } catch (error) {
                console.error("Error placing order:", error);
                alert("Failed to place order.");
            }
        }

    </script>
</body>

</html>
